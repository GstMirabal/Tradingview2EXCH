services:
  web:
    build:
      context: .
      dockerfile: docker/DockerFile
    container_name: "${PROJECT_NAME}"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # A single-file volume mount is unreliable in Docker unless the file
      # already exists in the image, so this mounts a directory instead.
      # Set `SQLITE_NAME = "data/db.sqlite3"` in config.toml so BASE_DIR /
      # SQLITE_NAME (backend/config/settings.py) resolves inside it — keeps
      # the DB across `docker-compose down` without shadowing app code.
      - sqlite_data:/opt/tradingview2exch/data

volumes:
  sqlite_data:
