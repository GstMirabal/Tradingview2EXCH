name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, system checks, missing-migration check, suite, documentation gate and
  # the production boot simulation all come from the shared pipeline. Calling it
  # rather than copying it is the point: a copied pipeline drifts, and the drift
  # stays invisible until two repositories behave differently under one commit.
  ci:
    uses: GstMirabal/Django-Pro-Template/.github/workflows/django-ci.yml@main
    with:
      project-name: tradingview2exch-ci
      sprint-id: "3"

  # What the shared pipeline does not cover, because it is this repository's
  # own: the container image, and a formatting gate the template cannot enable
  # yet (its own tree is unformatted — django-users-app roadmap P2-8).
  repo-specific:
    name: Format check and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Format check
        run: ruff format --check backend/

      - name: Provision config
        run: cp config.toml.example config.toml

      - name: Build image
        run: docker build -f docker/DockerFile -t tradingview2exch:ci .
